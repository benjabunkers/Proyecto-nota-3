# Un puerto aleatorio evita conflictos al ejecutar pruebas.
server.port=0

# Las pruebas son aisladas y no necesitan conectarse a Eureka.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# H2 crea una base temporal compatible con MySQL y la elimina al finalizar.
spring.datasource.url=jdbc:h2:mem:empleados_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Reduce el ruido de logs y desactiva Swagger durante las pruebas.
logging.level.com.duoc.msempleados=WARN
logging.level.org.springframework=WARN
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
