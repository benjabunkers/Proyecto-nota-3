spring.application.name=ms-empleados

server.port=8086

spring.datasource.url=jdbc:mysql://localhost:3306/prueba1?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.com.duoc.msempleados=INFO
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
api.gateway.url=${API_GATEWAY_URL:http://localhost:8080}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
springdoc.swagger-ui.enabled=true

