# agregado: nombre del microservicio
spring.application.name=ms-reportes

# agregado: puerto indicado en la pauta
server.port=8087

# agregado: conexion a la base de datos prueba4
spring.datasource.url=jdbc:mysql://localhost:3306/prueba4?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# agregado: driver MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# agregado: configuracion JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# agregado: Flyway para crear tablas e insertar datos
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# agregado: logs
logging.level.com.duoc.ms_reportes=INFO
logging.level.org.hibernate.SQL=DEBUG
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
api.gateway.url=${API_GATEWAY_URL:http://localhost:8080}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
springdoc.swagger-ui.enabled=true

