# Puerto HTTP utilizado por clientes durante desarrollo.
server.port=8081

# Conexion MySQL; las variables de entorno permiten cambiar valores sin editar el archivo.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:prueba1}?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA actualiza el esquema y muestra las consultas para facilitar el desarrollo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Nivel de detalle de los mensajes propios del microservicio.
logging.level.com.duoc.ms_clientes=INFO

# DataFaker completa la base hasta alcanzar la cantidad indicada.
app.data-faker.enabled=true
app.data-faker.records=10
