# Puerto HTTP utilizado por reservas durante desarrollo.
server.port=8083

# Conexion MySQL; las variables de entorno permiten cambiar valores sin editar el archivo.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:prueba2}?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA mantiene las entidades sincronizadas con el esquema existente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway ejecuta en orden las migraciones SQL incluidas en db/migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Nivel de detalle de los mensajes propios del microservicio.
logging.level.com.duoc.ms_reservas=INFO

# DataFaker crea reservas y limita los ID aleatorios a datos externos existentes.
app.data-faker.enabled=true
app.data-faker.records=10
app.data-faker.cliente-id-max=10
app.data-faker.vehiculo-id-max=10
