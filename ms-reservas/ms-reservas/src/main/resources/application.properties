# Identidad del microservicio y perfil usado cuando no se indica otro.
spring.application.name=ms-reservas
spring.profiles.default=dev

# Eureka permite registrar y descubrir servicios por su nombre.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# URL publica usada para construir enlaces HATEOAS hacia otros microservicios.
api.gateway.url=${API_GATEWAY_URL:http://localhost:8080}

# SpringDoc publica la especificacion OpenAPI y la interfaz Swagger UI.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
