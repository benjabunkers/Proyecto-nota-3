server.port=0

eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

spring.datasource.url=jdbc:h2:mem:reservas_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

logging.level.com.duoc.ms_reservas=WARN
logging.level.org.springframework=WARN

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.data-faker.enabled=true
app.data-faker.records=5

spring.flyway.enabled=false

app.data-faker.cliente-id-max=5
app.data-faker.vehiculo-id-max=5
